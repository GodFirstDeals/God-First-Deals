
name: Quality checks

on:
  push:
    branches:
      - main
      - qa/pre-deployment-review
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Install, check, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check package files
        run: |
          test -f package.json
          test -f package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Astro project
        run: npm run check

      - name: Build website
        run: npm run build

      - name: Run product tests
        run: npm test
